<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fading</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Extra+Light:wght@200&family=Cinzel:wght@400&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #030303; 
            overflow: hidden;
            font-family: 'Cinzel', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            -webkit-user-select: none;
            user-select: none;
        }

        #fading-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* Замени ссылку ниже на свое фото */
            background-image: url('images/att.Rp2mD4EBxbFIX5UNvseNl0xEpxl2smge7ynCHyGBXaA.jpeg'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0.07; 
            filter: blur(2px) grayscale(100%); 
            z-index: 0; 
            pointer-events: none;
        }

        #glitch-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            opacity: 0;
            pointer-events: none;
            z-index: 5;
        }

        .ash-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .ash-particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            pointer-events: none;
            animation: drift linear infinite;
        }

        @keyframes drift {
            0% { transform: translateY(-10vh) translateX(0) rotate(0deg); opacity: 0; }
            10% { opacity: 0.3; }
            90% { opacity: 0.1; }
            100% { transform: translateY(110vh) translateX(50px) rotate(360deg); opacity: 0; }
        }

        .text-container {
            z-index: 10;
            text-align: center;
            filter: blur(0.5px);
        }

        .status-text {
            color: #d1d1d1;
            font-size: clamp(2rem, 8vw, 5rem);
            font-weight: 200;
            letter-spacing: 25px;
            text-transform: lowercase;
            margin: 0;
            opacity: 0.6;
            animation: dissolve 8s ease-in-out infinite alternate;
        }

        @keyframes dissolve {
            0% {
                opacity: 0.1;
                letter-spacing: 40px;
                filter: blur(10px);
                transform: scale(1.1);
            }
            50% {
                opacity: 0.5;
                filter: blur(2px);
            }
            100% {
                opacity: 0.2;
                letter-spacing: 20px;
                filter: blur(5px);
                transform: scale(0.95);
            }
        }

        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            box-shadow: inset 0 0 150px #000;
            pointer-events: none;
            z-index: 2; 
        }
    </style>
</head>
<body>

    <div id="fading-background"></div>
    <div class="vignette"></div>
    <div id="glitch-overlay"></div>
    <div class="ash-container" id="ash-container"></div>

    <div class="text-container">
        <h1 class="status-text" id="main-text">vanishing</h1>
    </div>

    <script>
        // Защита
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', e => {
            if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && ['I','J','C'].includes(e.key.toUpperCase())) || (e.ctrlKey && e.key.toLowerCase() === 'u')) {
                e.preventDefault();
            }
        });

        const ambientAudio = new Audio('https://actions.google.com/sounds/v1/ambiences/wind_soft_howl.ogg');
        ambientAudio.loop = true;
        ambientAudio.volume = 0.3;

        const heartbreakSound = new Audio('https://actions.google.com/sounds/v1/foley/static_crackle.ogg');
        heartbreakSound.volume = 0.2;

        // Попытка автовоспроизведения (сработает, если браузер позволит)
        // Если нет — звук включится после первого клика по странице
        const startAudio = () => {
            ambientAudio.play().catch(() => {
                console.log("Audio waiting for user interaction...");
            });
            document.removeEventListener('click', startAudio);
        };
        document.addEventListener('click', startAudio);
        
        // Запуск логики сразу
        window.onload = () => {
            triggerFade();
            startAudio(); 
        };

        // Пепел
        const ashContainer = document.getElementById('ash-container');
        const ashCount = 80;

        for (let i = 0; i < ashCount; i++) {
            const ash = document.createElement('div');
            ash.classList.add('ash-particle');
            const size = Math.random() * 3 + 1;
            const xPosition = Math.random() * 100;
            const delay = Math.random() * 10;
            const duration = Math.random() * 10 + 5;
            ash.style.width = `${size}px`;
            ash.style.height = `${size}px`;
            ash.style.left = `${xPosition}vw`;
            ash.style.animationDuration = `${duration}s`;
            ash.style.animationDelay = `-${delay}s`;
            ashContainer.appendChild(ash);
        }

        // Глюки и смена слов
        const glitch = document.getElementById('glitch-overlay');
        const words = ["vanishing", "numb", "cold", "empty", "forgotten", "almost"];
        const mainText = document.getElementById('main-text');

        function triggerFade() {
            heartbreakSound.currentTime = 0;
            // Звук треска тоже может блокироваться до клика
            heartbreakSound.play().catch(()=>{});

            glitch.style.opacity = Math.random() * 0.15;
            const originalWord = mainText.innerText;
            mainText.innerText = words[Math.floor(Math.random() * words.length)];
            mainText.style.filter = "blur(5px)";

            setTimeout(() => {
                glitch.style.opacity = 0;
                mainText.innerText = originalWord;
                mainText.style.filter = "blur(0.5px)";
            }, 150);

            setTimeout(triggerFade, 3000 + Math.random() * 8000);
        }
    </script>
</body>
</html>
