<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fading</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Extra+Light:wght@200&family=Cinzel:wght@400&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #0a0a0a; /* Цвет глубокого пепла */
            overflow: hidden;
            font-family: 'Cinzel', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            -webkit-user-select: none;
            user-select: none;
        }

        /* Оверлей начала - тихий и пустой */
        #start-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #0a0a0a;
            color: rgba(255, 255, 255, 0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 0.9rem;
            letter-spacing: 8px;
            text-transform: uppercase;
            cursor: pointer;
            z-index: 100;
            transition: opacity 2s ease-in-out;
        }

        /* Эффект "глюка" или затухания сознания */
        #glitch-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            opacity: 0;
            pointer-events: none;
            z-index: 5;
        }

        /* Контейнер для пепла */
        .ash-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .ash-particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            pointer-events: none;
            animation: drift linear infinite;
        }

        @keyframes drift {
            0% { transform: translateY(-10vh) translateX(0) rotate(0deg); opacity: 0; }
            10% { opacity: 0.3; }
            90% { opacity: 0.1; }
            100% { transform: translateY(110vh) translateX(50px) rotate(360deg); opacity: 0; }
        }

        .text-container {
            z-index: 10;
            text-align: center;
            filter: blur(0.5px);
        }

        .status-text {
            color: #d1d1d1;
            font-size: clamp(2rem, 8vw, 5rem);
            font-weight: 200;
            letter-spacing: 25px;
            text-transform: lowercase;
            margin: 0;
            opacity: 0.6;
            animation: dissolve 8s ease-in-out infinite alternate;
        }

        /* Анимация распада и исчезновения */
        @keyframes dissolve {
            0% {
                opacity: 0.1;
                letter-spacing: 40px;
                filter: blur(10px);
                transform: scale(1.1);
            }
            50% {
                opacity: 0.5;
                filter: blur(2px);
            }
            100% {
                opacity: 0.2;
                letter-spacing: 20px;
                filter: blur(5px);
                transform: scale(0.95);
            }
        }

        /* Тонкая виньетка для чувства клаустрофобии */
        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            box-shadow: inset 0 0 150px #000;
            pointer-events: none;
            z-index: 20;
        }
    </style>
</head>
<body>

    <div id="start-overlay">let it go</div>
    <div class="vignette"></div>
    <div id="glitch-overlay"></div>
    <div class="ash-container" id="ash-container"></div>

    <div class="text-container">
        <h1 class="status-text" id="main-text">vanishing</h1>
    </div>

    <script>
        // Защита (оставлена без изменений)
        const warningMessage = "...";
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', e => {
            if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && ['I','J','C'].includes(e.key.toUpperCase())) || (e.ctrlKey && e.key.toLowerCase() === 'u')) {
                e.preventDefault();
            }
        });

        // Аудио: теперь это низкочастотный гул и белый шум (эмбиент)
        const ambientAudio = new Audio('https://actions.google.com/sounds/v1/ambiences/wind_soft_howl.ogg');
        ambientAudio.loop = true;
        ambientAudio.volume = 0.3;

        const heartbreakSound = new Audio('https://actions.google.com/sounds/v1/foley/static_crackle.ogg');
        heartbreakSound.volume = 0.2;

        // Генерация пепла (вместо дождя)
        const ashContainer = document.getElementById('ash-container');
        const ashCount = 80;

        for (let i = 0; i < ashCount; i++) {
            const ash = document.createElement('div');
            ash.classList.add('ash-particle');
            
            const size = Math.random() * 3 + 1;
            const xPosition = Math.random() * 100;
            const delay = Math.random() * 10;
            const duration = Math.random() * 10 + 5;

            ash.style.width = `${size}px`;
            ash.style.height = `${size}px`;
            ash.style.left = `${xPosition}vw`;
            ash.style.animationDuration = `${duration}s`;
            ash.style.animationDelay = `-${delay}s`;

            ashContainer.appendChild(ash);
        }

        // Эффект "эмоционального провала" (вместо молнии)
        const glitch = document.getElementById('glitch-overlay');
        const words = ["vanishing", "numb", "cold", "empty", "forgotten", "almost"];
        const mainText = document.getElementById('main-text');

        function triggerFade() {
            // Редкие вспышки "белого шума"
            heartbreakSound.currentTime = 0;
            heartbreakSound.play();

            glitch.style.opacity = Math.random() * 0.15;
            
            // Смена слова на мгновение
            const originalWord = mainText.innerText;
            mainText.innerText = words[Math.floor(Math.random() * words.length)];
            mainText.style.filter = "blur(5px)";

            setTimeout(() => {
                glitch.style.opacity = 0;
                mainText.innerText = originalWord;
                mainText.style.filter = "blur(0.5px)";
            }, 150);

            const nextEvent = 3000 + Math.random() * 8000;
            setTimeout(triggerFade, nextEvent);
        }

        // Инициализация
        const startOverlay = document.getElementById('start-overlay');
        startOverlay.addEventListener('click', () => {
            startOverlay.style.opacity = '0';
            setTimeout(() => startOverlay.style.display = 'none', 2000);
            ambientAudio.play();
            setTimeout(triggerFade, 2000);
        });
    </script>

</body>
</html>
